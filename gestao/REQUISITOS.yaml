- {id: REQ-REA-010, data: "2026-11-22", area: REATOR, critico: true, requisito: "Usar a simulação de campo magnético (FEM) dos indutores para especificar a MONTAGEM: distâncias calculadas entre reatores, até partes metálicas (prateleira, estrutura, placa) e até os cabos de força – no desenho e na especificação técnica (antes era no chute, nunca calculado).", fonte: "conversa 22/11 18:42", atende: "fsen/reator_montagem.py: campo FEM externo → distâncias (aço 2 mT, força 5 mT, comando 1 mT, pessoas ICNIRP 1 mT); aplicado no arranjo e no RESUMO", verificacao: "manual", status: ATENDIDO, desde: "1.25.2", nota: "Panatlântica: aço/entre reatores ≥ 100 mm, força ≥ 50 mm, comando/porta ≥ 150 mm"}
- {id: REQ-PNL-008, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Termostato -BT2 55 °C de sobretemperatura no esquema; termostato por reator; regras Schneider/EN 61921: reator nunca abaixo do capacitor, ar entra embaixo e sai pelo teto.", fonte: "CHANGELOG v1.17.0/1.18.4", atende: "eplan, painel_gabinete", verificacao: "manual", status: ATENDIDO, desde: "1.18.4"}
- {id: REQ-PNL-009, data: "2026-11-22", area: PAINEL, critico: false, requisito: "Lista de plaquetas no modelo das montadoras (FEMSA/Novemp) e etiquetas de fio/componente/cabo (DE/PARA) para os 3 filtros.", fonte: "CHANGELOG v1.16.1/1.17.0", atende: "eplan/etiquetas.py", verificacao: "manual", status: ATENDIDO, desde: "1.16.1"}
- {id: REQ-PNL-010, data: "2026-11-22", area: PAINEL, critico: false, requisito: "Largura do gabinete calibrada pelos dimensionais IFG e projetos executados (Panatlântica 2024: 1600 × 2000 × 800, 2 colunas de 788)", fonte: "CHANGELOG v1.17.4 + layout Panatlântica REV 1", atende: "painel_gabinete.py", verificacao: "manual", status: PARCIAL, desde: "1.17.4", nota: "Com o reator maior que o Cootrans a plataforma vai para 2000 mm – depende de REQ-REA-002."}
- {id: REQ-GER-007, data: "2026-11-22", area: GERAL, critico: true, requisito: "\"Vc deve salvar tudo automaticamente, não precisa da minha autorização: eu escrevo aqui o que eu quero e vc salva para não perder nada de informação e executa essa melhoria.\"", fonte: "conversa 22/11 16:02", atende: "CLAUDE.md + gestao/REQUISITOS.yaml (registro imediato de toda mensagem com instrução)", verificacao: "auto:gestao_existe", status: ATENDIDO, desde: "1.24.1", nota: "Processo: cada mensagem com instrução → REQ novo no mesmo turno, commit, cópia no Drive; depois implementar e atualizar o status."}
- {id: REQ-PNL-011, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Equipamentos do 3D/2D iguais ao que ficará montado (não grosseiros) – o desenho é o documento para cobrar o montador: 'vou cobrar ele depois porque não ficou igual'. O mais realista e técnico possível para a montagem.", fonte: "conversa 22/11 16:12", atende: "fsen/painel3d.py", verificacao: "manual: engenheiro aprova as folhas", status: PARCIAL, desde: "1.24.2", nota: "Componentes com forma de catálogo (capacitor com friso/terminais, Fupact com tampa e punho, TeSys escalonada, reator com núcleo/quadros/tirantes/saídas). Falta: cabo reator→capacitor, régua de bornes/comando, trafo de comando, cotas por componente."}
- {id: REQ-PNL-012, data: "2026-11-22", area: PAINEL, critico: true, requisito: "A IA revisa o arranjo como montador/projetista: não precisa seguir exatamente os desenhos antigos; subir contatoras se precisar; nada que o montador não consiga montar (barra, cabo); sem espaço vazio feio na placa; equipamentos mais afastados para dissipar calor, montar melhor e ficar mais bonito – vale para TODOS os componentes.", fonte: "conversa 22/11 16:12", atende: "fsen/painel3d.py (distribuição + verificações de montagem)", verificacao: "auto:painel_montagem", status: PARCIAL, desde: "1.24.2", nota: "Distribuição vertical com folgas iguais, chaves/contatoras espalhadas na largura, capacitores espalhados, reatores afastados por igual, verificações de montagem com Check. Falta: otimizar ordem das fileiras automaticamente."}
- {id: REQ-PNL-013, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Barras e cabos desenhados com rota montável (barramento → chaves NH → contatoras → reator → capacitores), canaletas, passagens na placa – o montador tem que conseguir ligar.", fonte: "conversa 22/11 16:12", atende: "fsen/painel3d.py", verificacao: "auto:painel_montagem", status: PARCIAL, desde: "1.24.2", nota: "Barramento sobre isoladores, cordoalhas barra→chave, cabos chave→contatora pela canaleta, passa-cabos na placa, cabos no verso da placa até as saídas do reator (rota ortogonal). Falta: retorno reator→capacitores e cabos de comando."}
- {id: REQ-GER-008, data: "2026-11-22", area: GERAL, critico: true, requisito: "Motor de experiência: depois que o engenheiro aprova um painel/projeto, as características ficam salvas na plataforma (Drive); projeto novo parte do último aprovado que se encaixa, não do zero, e cada projeto pode melhorar o próximo – experiência da equipe salva, não só na cabeça do engenheiro.", fonte: "conversa 22/11 16:12", atende: "dados/paineis_aprovados/ + fsen/biblioteca_paineis.py", verificacao: "auto:biblioteca_paineis", status: ATENDIDO, desde: "1.24.2", nota: "fsen/biblioteca_paineis.py + botão 'Aprovar painel' na tela do banco/sintonizado; projeto novo parte do último aprovado (layout_painel.json registra de onde partiu). Biblioteca no Drive em BIBLIOTECA_PAINEIS."}
- {id: REQ-SEG-007, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Energia incidente (arco elétrico) – muito pedida: aplicar no painel as boas práticas para EVITAR arco e REDUZIR energia incidente; calcular conforme IEEE 1584 usando o módulo de energia incidente da Plataforma de Estudos (cópia separada).", fonte: "conversa 22/11 16:16", atende: "-", verificacao: "manual", status: ATENDIDO, desde: "1.24.3", nota: "Estudo_Energia_Incidente + Etiqueta_Arco_Eletrico por projeto (IEEE 1584-2018, módulo arcflash da Plataforma de Estudos); Panatlântica: barramento 2,0 cal/cm² com DJ geral × 19,9 sem. Tempo da proteção do cliente (500 ms) é premissa a confirmar."}
- {id: REQ-SEG-008, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Painel deve seguir norma – pelo menos NR-10 (e o que o mercado exige: IEC 61439, NBR IEC 61439, IEC TR 61641, NFPA 70E/IEEE 1584) – com verificação e documentação.", fonte: "conversa 22/11 16:16", atende: "normas_banco.py (61439/61921 – NR-10 ainda não)", verificacao: "manual", status: PARCIAL, desde: "1.23.0"}
- {id: REQ-PNL-014, data: "2026-11-22", area: PAINEL, critico: false, requisito: "Pesquisar na internet o que as empresas mais pedem na montagem de painéis de filtros/bancos e incorporar como padrão Electric.", fonte: "conversa 22/11 16:16", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-GER-009, data: "2026-11-22", area: GERAL, critico: true, requisito: "\"Lembra que é para o Brasil\" – normas, práticas e documentos para o mercado brasileiro: NR-10, ABNT NBR IEC 61439, NBR 5410, NBR 17227 (arco elétrico, nova), NBR 16384; componentes disponíveis no Brasil; textos em português.", fonte: "conversa 22/11 16:16", atende: "-", verificacao: "manual", status: PARCIAL, desde: "-"}
- {id: REQ-PNL-015, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Usar os modelos 3D REAIS dos componentes (fabricantes publicam STEP/CAD na internet: capacitores, contatoras, chaves, fusíveis, controlador, cabos) – o indutor já tem desenho real (FEM/STEP) – em vez de formas aproximadas.", fonte: "conversa 22/11 16:25", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-", nota: "Plano: biblioteca 3D (STEP oficial do fabricante → malha leve STL convertida uma vez) em dados/modelos_3d + Drive BIBLIOTECA_3D; painel3d carrega a malha real quando existir, senão a forma de catálogo. Já temos: STEP do Fupact ISFT400 (CVI 2021) e STEP do reator Electric (FEM)."}
- {id: REQ-SEG-009, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Energia incidente aplicada NA MONTAGEM dos componentes (pergunta 'o que muda na montagem?'): compartimento do barramento separado (forma 2b/3b), chave-fusível geral limitadora na entrada com punho na porta + intertravamento + cadeado, barramento isolado e protetores de borne/barreiras (IPXXB), torque marcado, operação e inspeção com porta fechada (controlador, janelas de termografia), ponto de aterramento temporário e de teste de ausência de tensão, sensores ópticos de arco (opcional), alívio de pressão para cima, zona de comando separada, etiqueta de arco e sinalização NR-10.", fonte: "conversa 22/11 16:27", atende: "-", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "No 3D/lista: compartimento do barramento, DJ geral c/ manopla, PE, pinos de aterramento temporário, indicador de tensão, etiqueta. Falta: torque marcado na lista, janelas de termografia, sensores ópticos (opcional)."}
- {id: REQ-PNL-016, data: "2026-11-22", area: PAINEL, critico: true, requisito: "2D/3D com TUDO do projeto elétrico (força + comando), 100 % igual à montagem: etiquetas/plaquetas do projeto coladas nos componentes e nos fios, cabos de força até os capacitores, aterramento (barra PE e cabos verde-amarelo), trafo de comando, disjuntores e relés de comando, bornes.", fonte: "conversa 22/11 16:35", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-PNL-017, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Cabos na canaleta COM cálculo (NBR 5410: agrupamento, temperatura interna do painel, ocupação da canaleta) e recálculo de TODOS os componentes com o painel fechado, tudo ligado e aquecendo (derating de contatoras, fusíveis, chaves, cabos e capacitores pela temperatura interna – IEC 61439 §10.10 / IEC 60890).", fonte: "conversa 22/11 16:35", atende: "-", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "Cabos pela NBR 5410 (FCT ar interno 50 °C × FCA nº de circuitos na canaleta). Falta: ocupação de canaleta e derating térmico de cada componente com o painel fechado."}
- {id: REQ-PNL-018, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Barramento geral de força ÚNICO (uma barra contínua atravessando as colunas).", fonte: "conversa 22/11 16:35", atende: "-", verificacao: "manual", status: ATENDIDO, desde: "1.24.3", nota: "Barramento geral único atravessando as colunas, em compartimento com policarbonato (3D, lista de material)."}
- {id: REQ-SEG-010, data: "2026-11-22", area: SEGURANCA, critico: true, requisito: "Disjuntor geral (seccionamento geral) dentro do painel com manopla externa e intertravamento da porta – NR-10 não permite abrir painel energizado; hoje não se faz painel sem seccionador geral.", fonte: "conversa 22/11 16:35", atende: "-", verificacao: "manual", status: ATENDIDO, desde: "1.24.3", nota: "-Q0 disjuntor geral com manopla rotativa externa, intertravamento e cadeado no esquema, na lista de material, no 3D e no checklist NR-10."}
- {id: REQ-SEG-011, data: "2026-11-22", area: SEGURANCA, critico: true, requisito: "Ler TODAS as normas aplicáveis e aplicar nos painéis dos 3 filtros considerando o PIOR CASO (cliente exige tudo; painel auditado em segurança elétrica): NR-10, NBR IEC 61439-1/2, NBR 5410, norma de arco (ABNT/IEEE 1584), IEC 61921, IEC 60831, sinalização e prontuário – com checklist de auditoria e Check.", fonte: "conversa 22/11 16:35", atende: "normas_banco.py (parcial)", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-PNL-019, data: "2026-11-22", area: PAINEL, critico: true, requisito: "TODOS os componentes com desenho realista e REAL (modelo do fabricante) – não pode ser caixa quadrada com tamanho chutado: 'se for assim eu faço eu mesmo no CAD'.", fonte: "conversa 22/11 16:36", atende: "reator: peças reais do STEP (v1.24.3); demais: forma de catálogo", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "Próximo: modelos 3D oficiais (STEP) de cada componente → malha leve; sem modelo oficial, não entra como 'real'."}
- {id: REQ-SEG-012, data: "2026-11-22", area: SEGURANCA, critico: true, requisito: "Aplicar a NOVA NR-10 (Portaria MTE 737/2026, vigência 01/06/2027) já nos projetos: 10.4.1 desligamento com impedimento de reenergização e sinalização; 10.4.2 seccionamento simultâneo; 10.4.3.1 circuitos de finalidades distintas separados; 10.4.4 aterramento; 10.4.5/10.4.6 aterramento temporário; 10.4.9 memorial descritivo (a–f); 10.4.12 estudo de energia incidente; 10.6.1/10.6.2 partes vivas inacessíveis (barreiras/invólucros); 10.6.5 medidas contra arco (distância segura, abertura sob carga, intertravamento, fechaduras não intercambiáveis, limitadores de corrente, tempo curto); 10.7.7/10.7.7.1 porta fechada e sinalização de tensão, choque e arco; 10.13 sequência de desenergização/reenergização prevista em projeto; Anexo II/IV (Rr 0,20 m, Rc 0,70 m, distância de trabalho 455 mm, 1,2 cal/cm²).", fonte: "pesquisa 22/11 – Portaria MTE 737/2026 (normaslegais.com.br)", atende: "-", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "Checklist NR-10 2026 (11 itens de projeto) na folha de normas. Falta memorial descritivo 10.4.9 completo e sequência 10.13 no manual."}
- {id: REQ-REF-003, data: "2026-11-22", area: REFERENCIAS, critico: true, requisito: "\"Não precisa se adaptar ao meu projeto antigo – usa os projetos antigos somente como referência; vai fazer um novo com tamanhos diferentes, não tem como ser igual o seu projeto da Panatlântica com o meu manual.\"", fonte: "conversa 22/11 16:44–16:46 (+ \"O seu tem que ser melhor, não será 100 % igual, entendeu\")", atende: "REQ-REA-002 revisto: comparação com o real é informativa (justificar diferenças), não obrigação de caber no mesmo painel", verificacao: "manual", status: ATENDIDO, desde: "1.24.3"}
- {id: REQ-REF-004, data: "2026-11-22", area: REFERENCIAS, critico: true, requisito: "\"Seu indutor é diferente, a contatora, os cabos. Os projetos anteriores são referência, ponto de partida, um padrão Electric, uma forma – quem olhar o projeto manual da Panatlântica e o seu deve pensar que foi feito pela mesma empresa, seguem as mesmas referências, mas o feito pela plataforma tem que estar muito melhor que o antigo.\"", fonte: "conversa 22/11 16:48", atende: "identidade Electric (REQ-GER-003) + REQ-REF-003", verificacao: "manual: engenheiro compara antigo × plataforma", status: PARCIAL, desde: "1.24.3"}
- {id: REQ-PNL-020, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Definir, especificar e CALCULAR o disjuntor geral (corrente, Icu × Icc da barra, ajustes) e o trafo de comando pela CARGA do comando (bobinas das contatoras – partida e retenção –, controlador, exaustores, sinaleiros, relés).", fonte: "conversa 22/11 16:49", atende: "-", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "Disjuntor geral calculado (1,30·ΣI, Icu ≥ Icc, LSI) e trafo de comando pela carga (retenção + pior manobra). Falta escolher o MODELO exato no banco de componentes (REQ-GER-010) e o 3D real."}
- {id: REQ-PNL-021, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Nada pendente e nada de achismo: dimensionar e especificar TUDO até o parafuso – torque dos terminais, tipo de parafuso, arruelas, terminais de cabo (olhal/compressão), conectores, isoladores e suportes de barra, barra isolada para montagem, tipo de disjuntor geral, relé falta de fase etc. Nenhum item pode faltar na lista de material.", fonte: "conversa 22/11 16:53", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-PNL-022, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Marca coerente em todos os componentes: projeto ABB → componentes ABB; Schneider → Schneider; padrão Electric → os que foram usados na Panatlântica 2024; se não houver, um do banco de dados da plataforma.", fonte: "conversa 22/11 16:53", atende: "banco.py (marca dos componentes – parcial)", verificacao: "manual", status: PARCIAL, desde: "1.20.0"}
- {id: REQ-GER-010, data: "2026-11-22", area: GERAL, critico: true, requisito: "Banco de dados de componentes NA PLATAFORMA (códigos, medidas, modelo 3D, consumo, torques, acessórios), para não precisar buscar na internet; no máximo uma verificação rápida no site do fabricante se ainda é vendido.", fonte: "conversa 22/11 16:53", atende: "dados/dimensoes_componentes.yaml (início)", verificacao: "manual", status: PARCIAL, desde: "1.24.0"}
- {id: REQ-GER-011, data: "2026-11-22", area: GERAL, critico: true, requisito: "REGRA: sempre conferir QUANTOS capacitores por estágio/indutor (ex.: 3 × 25 kvar 525 V por indutor na Panatlântica) – quantidade, kvar e tensão iguais no cálculo, esquema, DE/PARA, lista de material, 2D/3D e ET do reator. Vale para TODOS os filtros (senoidal, dessintonizado, sintonizado).", fonte: "conversa 22/11 18:20", atende: "conferencia_projeto.capacitores_por_estagio (cálculo × esquema × DE/PARA × lista × 3D × ET do reator)", verificacao: "auto:conferencia_cruzada", status: ATENDIDO, desde: "1.25.2", nota: "banco (dessintonizado/sintonizado); senoidal: entra quando o painel senoidal for para o novo conceito (REQ-GER-003)"}
- {id: REQ-PNL-023, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Posição do barramento geral: atrás da placa junto com os indutores (mais seguro?) ou na frente? Decidir com base em norma, prática dos fabricantes (ABB, Schneider, Siemens, Eaton…), internet e fóruns – e aplicar o que for mais seguro.", fonte: "conversa 22/11 17:03", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-", nota: "Decisão (pesquisa 22/11): barramento geral no ALTO, ATRÁS da placa, em compartimento próprio (forma 2b) separado dos reatores por chapa horizontal; derivações para as chaves NH por barra flexível isolada através de passa-barra na placa. Motivo: o operador abre a porta da frente (fusíveis, contatoras) sem ficar diante do barramento; prática de quadros com compartimento de barramento traseiro (formas IEC 61439-2) e do layout AGCO; cuidado: compartimento traseiro mais quente → barra calculada com a temperatura do topo do compartimento."}
- {id: REQ-SEG-013, data: "2026-11-22", area: SEGURANCA, critico: false, requisito: "\"O estudo de energia incidente eu faço depois em outro software; vc só faz aqui de forma simplificada para ver os detalhes\" – a etiqueta do painel sai como PRELIMINAR (valores dependem da proteção a montante e da Icc da instalação), a confirmar pelo estudo da instalação.", fonte: "conversa 22/11 17:04", atende: "fsen/arco.py", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-PNL-024, data: "2026-11-22", area: PAINEL, critico: false, requisito: "Classificar a forma de separação (NBR IEC 61439-2) de cada painel e declarar na folha de dados: o painel antigo de montagem livre (sem barreiras) é forma 1; o novo com barramento em compartimento próprio é forma 2b.", fonte: "conversa 22/11 17:06 (pergunta: o meu painel de montagem livre é um 2b?)", atende: "painel3d.py (verificação) – falta na folha de dados", verificacao: "manual", status: PARCIAL, desde: "1.25.0"}
- {id: REQ-SEG-014, data: "2026-11-22", area: SEGURANCA, critico: true, requisito: "Seguir TODAS as normas de montagem nos painéis dos 3 FILTROS (senoidal, dessintonizado, sintonizado) – pode ser auditado a qualquer momento por cliente exigente (conversa 22/11 17:09). Matriz de conformidade COMPLETA do painel (NR-10 2026 + NBR IEC 61439-1/2 §10 verificação de projeto item a item e §11 ensaios de rotina + IEC 61921 + IEC 60831 + NBR 5410), com o método de cada item (cálculo, comparação com projeto de referência, avaliação ou ensaio) e Check – pergunta 'vc tá seguindo todas as normas da NR e IEC para este tipo de painel?'.", fonte: "conversa 22/11 17:08", atende: "normas_banco.py (parcial)", verificacao: "manual", status: PARCIAL, desde: "1.24.3", nota: "Faltam por cálculo: suportabilidade do barramento ao curto (Icw – forças e vão dos isoladores, §10.11), circuito de proteção (§10.5), elevação de temperatura componente a componente com derating (§10.10), incorporação de dispositivos e terminais (§10.6/10.8), operação mecânica (§10.13), CEM (§10.12); memorial descritivo NR-10 10.4.9 e procedimento 10.13."}
- {id: REQ-PNL-025, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Entrada dos cabos do cliente no disjuntor geral: por CIMA ou por BAIXO (cada cliente quer de um jeito) – opção no projeto, quantidade e seção dos cabos de entrada calculadas (cabos em paralelo), espaço de curvatura, flange/prensa-cabos no teto ou na base.", fonte: "conversa 22/11 17:40", atende: "banco.cabos_entrada (NBR 5410, paralelos ≤ 240 mm²) + opção cima/baixo na tela (entrada_cabos) + flange/cabos no 3D + linhas -X0 na lista", verificacao: "manual", status: ATENDIDO, desde: "1.25.1", nota: "Panatlântica: 3 × 240 mm² por fase"}
- {id: REQ-PNL-026, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Padrão Electric: CABO (não barra flexível) entre a entrada das seccionadoras e o barramento geral.", fonte: "conversa 22/11 17:40", atende: "lista_material W n.1 (cabo barramento → seccionadora) + derivações em cabo no 3D", verificacao: "manual", status: ATENDIDO, desde: "1.25.1", nota: "cabo flexível calculado, não barra"}
- {id: REQ-PNL-027, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Capacitores do estágio (ex.: 4 × 18 kvar 480 V por indutor): um cabo por fase de CADA capacitor até a saída do indutor, com UM terminal para os n cabos por fase no borne do indutor; cabos do indutor e demais cabos de força sem encostar e afastados dos terminais.", fonte: "conversa 22/11 17:40", atende: "lista_material: 1 terminal por fase de cada capacitor + 1 terminal p/ os n cabos no borne do reator; cabos de força afastados dos bornes no 3D", verificacao: "manual", status: ATENDIDO, desde: "1.25.1", nota: "CONFERIR terminal duplo/múltiplo no catálogo"}
- {id: REQ-PNL-028, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Conferência cruzada OBRIGATÓRIA entre projeto elétrico (diagrama de força, diagrama de comando, DE/PARA, lista de material) e os desenhos de montagem 2D e 3D: tudo que está nos diagramas tem que estar no 2D/3D e na lista, e vice-versa – ZERO diferença (senão o montador diz que não tinha e não há como cobrar). Usar a IA para análise refinada se preciso.", fonte: "conversa 22/11 17:40; reforçado 18:23 (diagrama de comando + força + lista + 2D/3D: não pode faltar nem SOBRAR nada)", atende: "fsen/conferencia_projeto.py no pipeline (01_Engenharia/6_Conferencia_Projeto + RESUMO + montadora) + teste auto:conferencia_cruzada; fonte única de exaustores, trafo de comando, códigos de botões/termostatos/reator", verificacao: "auto:conferencia_cruzada", status: ATENDIDO, desde: "1.25.1", nota: "Panatlântica ABB e Schneider: 0 REPROVADO"}
- {id: REQ-PNL-029, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Não usar as etiquetas dos equipamentos na imagem de portas abertas (fica muito ruim) – tags só nas vistas da placa e no 2D.", fonte: "conversa 22/11 18:17", atende: "painel3d._cena: tags só em placa_f/frontal/placa_t/traseira", verificacao: "manual", status: ATENDIDO, desde: "1.25.2"}
- {id: REQ-PNL-030, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Cabos de força dos capacitores e indutores naturais, como montador faria: cada capacitor com seu cabo por fase (não um cabo só), e no indutor os cabos têm que aparecer CONECTADOS ao terminal (terminal único para os n cabos por fase).", fonte: "conversa 22/11 18:17", atende: "painel3d: 1 cabo/fase de cada capacitor pelo vão atrás das latas → canaleta → lateral → passa-cabo; reator com bornes para a porta, terminal 2 furos aparafusado (n cabos num terminal), cabos com raio de curvatura; canaletas no verso da placa", verificacao: "manual", status: ATENDIDO, desde: "1.25.2", nota: "bornes do reator virados para a porta traseira: acesso p/ aperto e termografia"}
- {id: REQ-PNL-031, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Ponto de aterramento de todos os componentes metálicos (norma exige) e barra de aterramento PE visível no 2D e 3D.", fonte: "conversa 22/11 18:17", atende: "painel3d: barra PE frente + barra PE traseira, cabo VA 16 mm²/cordoalha para placa, montantes, portas, prateleiras, quadro de cada reator, compartimento do barramento; PE do cliente; verificação do nº de pontos", verificacao: "manual", status: ATENDIDO, desde: "1.25.2", nota: "NBR IEC 61439-1 8.4.3"}
- {id: REQ-PNL-032, data: "2026-11-22", area: PAINEL, critico: false, requisito: "Melhorou muito mas pode ficar melhor, mais realista e mais natural – vale para o 2D e o 3D.", fonte: "conversa 22/11 18:17", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-"}
- {id: REQ-PNL-033, data: "2026-11-22", area: PAINEL, critico: true, requisito: "Exaustão forçada calculada pelo calor produzido (IEC 60890) e com componentes REAIS: exaustor e grelha de saída com filtro de catálogo (código, vazão real com filtro, consumo, recorte); mesma vazão/modelo no cálculo, esquema, lista, 3D e no trafo de comando (consumo real).", fonte: "conversa 22/11 18:38", atende: "painel_gabinete.EXAUSTOR_REAL (ClimaSys NSYCVF850M230PF: 803 m³/h c/ filtro, 195 W, 0,85 A) + grelha NSYCAG291LPF; mesma vazão/consumo no esquema, lista, 3D e trafo de comando", verificacao: "manual", status: ATENDIDO, desde: "1.25.2", nota: "achado: cálculo 4×850 m³/h, mas esquema/lista diziam ≥230 m³/h e trafo considerava 45 VA/exaustor"}
