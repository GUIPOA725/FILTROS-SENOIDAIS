# Critérios de suportabilidade por norma (aplicados conforme o campo "norma" de cada capacitor).
# Todos os valores são "contínuos, harmônicas incluídas". A verificação é feita no ponto nominal E nas condições extremas.
atp:                       # dupla checagem automática no ATP-EMTP (roda em segundo plano se instalado no PC)
  habilitado: true
  tpbig: 'C:\ATP\atpmingw\tpbig.exe'
  pasta_trabalho: 'C:\ATP\work\fsen'

normas_capacitor:
  IEC60831:      # IEC 60831-1/2 – capacitores de potência autorregenerativos (PFC: PhiCap, PEC, WEG UCW)
    v_rms_pu: 1.10           # Tabela de sobretensões: 1,10·UN 8 h/24 h
    v_pico_pu: 1.20          # critério adotado para o pico com harmônicas (√2·1,2·UN) – confirmar datasheet
    i_rms_fator_padrao: 1.3  # cl. 21: ≥ 1,3·IN; usar "imax_fator" do datasheet quando informado (ex.: PhiCap 1,5)
    q_pu: null
    dvdt_v_us: 20            # PFC não é capacitor de snubber – confirmar datasheet
  IEEE18:        # IEEE Std 18 – limites contínuos (contingência, não base de projeto)
    v_rms_pu: 1.10
    v_pico_pu: 1.20
    i_rms_fator_padrao: 1.35
    q_pu: 1.35
    dvdt_v_us: 20
  IEC61071:      # IEC 61071 – capacitores para eletrônica de potência (filtros AC). Base de projeto = datasheet:
    v_rms_pu: 1.00           # URMS contínuo (sobretensões: 1,10·UN 30 % do tempo em carga; 1,15 30 min/dia; 1,2 5 min; 1,3 1 min)
    v_pico_pu: 1.414         # Û recorrente ≤ UN (pico) do datasheet; se ausente, √2·URMS
    v_pico_extremo_pu: 1.10  # condição extrema de curta duração (IEC 61071 – 1,10·UN até 30 % do tempo em carga)
    i_rms_fator_padrao: 3.0  # só se o datasheet não der Imax (A)
    q_pu: null
    dvdt_v_us: null          # = Î/C do datasheet
    t_hotspot_max_c: 85
verificar_tambem_ieee18: true   # capacitores IEC 60831 (PFC): mostra também a IEEE 18 (informativo). Não se aplica a IEC 61071.

capacitor_termico:
  t_hotspot_max_c: 70          # ponto quente máximo admissível (filme PP) – confirmar datasheet
  vpk_max_pu: 1.20             # pico de tensão ≤ 1,2·√2·Un (harmônicas incluídas)
  dvdt_max_v_us: 20            # dv/dt admissível no capacitor de potência (PEC) – confirmar
  vida_ref_h: 100000           # vida de referência no ponto quente de referência
  t_ref_c: 70
  k_dobra_c: 7                 # vida dobra a cada 7 K a menos (regra prática filme PP)

