# Otimização global multiobjetivo: pesos da nota final (somam 1). Ajuste à sua estratégia.
otimizacao:
  pesos:
    custo: 0.35          # custo total do filtro montado (componentes + caixa + montagem)
    tamanho: 0.15        # volume da caixa metálica
    perdas: 0.15         # aquecimento (W)
    confiabilidade: 0.20 # estresse de capacitores, resistor de amortecimento, margem de ressonância
    thd: 0.10            # distorção de tensão no motor
    queda: 0.05          # queda de tensão / tensão disponível
  fs_khz_faixa: [2, 8]            # avalia todas as frequências de chaveamento do inversor nesta faixa (kHz)
  passo_uk_pct: 1.0
  # Restringir a otimização a estes capacitores (ex.: os do estoque). Vazio = todos do catálogo.
  capacitores_permitidos: []
  # Ligações do banco consideradas: [Estrela, Delta]. Delta usa 3× menos capacitores (cada um com tensão de linha).
  ligacoes_permitidas: [Estrela, Delta]
  # Cascata de topologias: LC sem resistor é o padrão; as demais só entram se nenhuma LC passar
  cascata_topologias: [LC, LC_RC, LC_R, LCL, LCL_RC]
