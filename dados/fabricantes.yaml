# Componentes por fabricante para bancos dessintonizados e filtros sintonizados – v1.20.0
# O REATOR é sempre Electric Service (projeto próprio), qualquer que seja a marca escolhida pelo cliente.
# "fonte": de onde saiu a referência; "conferir": true = código/valor a confirmar no catálogo atual antes da compra.
# Capacitores: kvar a 60 Hz (o projeto refaz a sintonia com a capacitância real da unidade escolhida).
# Contatoras: "comum" = AC-3/AC-1 (permitida com reator em série – Schneider FAQ FA408331, ABB 1SBC101140C0203);
#   ie_ac1 = corrente térmica AC-1 (A); pico_max = corrente de fechamento máxima admissível (A) p/ manobra de capacitor.
#   "capacitor" = AC-6b com resistores de pré-carga (pico ilimitado na prática).

"Padrão Electric":
  descricao: "Padrão dos projetos Electric (Drive): Epcos/TDK + WEG/Siemens/Holec equivalentes"
  capacitores: null            # usa a série padrão da plataforma (UNID_KVAR)
  contatora_preferida: capacitor

ABB:
  descricao: "Tudo ABB (exceto o reator, Electric)"
  fonte_geral:
    - "ABB 1SBC101140C0203 – Contactors for capacitor switching (tabelas A/AF e UA..RA)"
    - "ABB CLMD – LV capacitors (CLMD43/53/63/83; 500/525 V 60 Hz)"
  capacitores:
    serie: "CLMD (dielétrico seco, autorregenerativo)"
    unidades:          # V nominal: [kvar a 60 Hz]
      525: [15, 20, 25, 27.5]
      480: [15, 20, 25, 27.5]
      690: [20, 25, 30, 40, 50]
      800: [25, 40, 50]
    codigo: "CLMD43 {kvar} kvar {V} V 60 Hz (2GCA…A0030)"
    conferir: true
  contatora_preferida: comum
  contatoras:
    comum:             # [tipo, ie_ac1 (A), pico_max (A)] – A/AF, pico < 30·In do capacitor (tabela ABB)
      - ["ABB AF50-30-00", 100, 2300]
      - ["ABB AF63-30-00", 115, 2500]
      - ["ABB AF75-30-00", 125, 2600]
      - ["ABB AF96-30-00", 145, 4000]
      - ["ABB AF116-30-00", 160, 4000]
      - ["ABB AF146-30-00", 225, 4000]
      - ["ABB AF190-30-11", 275, 5000]
      - ["ABB AF265-30-11", 350, 8000]
    capacitor:         # UA..RA – kvar máx a 400/415 V 55 °C
      - ["ABB UA50-30-00RA", 40]
      - ["ABB UA63-30-00RA", 45]
      - ["ABB UA75-30-00RA", 50]
      - ["ABB UA95-30-00RA", 60]
      - ["ABB UA110-30-00RA", 70]
  seccionadora_fusivel: {codigo: "ABB OS{A}GD (OS160/OS250) – chave seccionadora-fusível NH", conferir: true}
  fusivel_gG: {codigo: "ABB OFAF{tam}H{A} gG {A} A", conferir: false}
  disjuntor: {codigo: "ABB Tmax XT2/XT4 {A} A (termomagnético)", conferir: true}
  disjuntor_comando: {codigo: "ABB S203-C10 / S202-C10", conferir: false}
  controlador: {6: "ABB RVC-6 (2GCA288096A0050)", 8: "ABB RVC-8", 10: "ABB RVC-10", 12: "ABB RVC-12", conferir: true}
  rele_falta_fase: {codigo: "ABB CM-PFE (1SVR550824R9300)", conferir: true}
  botoes: {emergencia: "ABB MPMT3-11R (cogumelo c/ trava)", seletor: "ABB M2SS1-10B", sinaleiro: "ABB CL2-523G / CL2-523R", conferir: true}
  termostato: {nf: "ABB/Rittal SK 3110.000 (NF, 0–60 °C)", na: "Rittal SK 3110.000 (NA)", conferir: true}
  ventilador: {codigo: "Rittal TopTherm SK 3243 / ABB (equiv.) {m3h} m³/h", conferir: true}

