# Componentes por fabricante para bancos dessintonizados e filtros sintonizados – v1.20.0
# O REATOR é sempre Electric Service (projeto próprio), qualquer que seja a marca escolhida pelo cliente.
# "fonte": de onde saiu a referência; "conferir": true = código/valor a confirmar no catálogo atual antes da compra.
# Capacitores: kvar a 60 Hz (o projeto refaz a sintonia com a capacitância real da unidade escolhida).
# Contatoras: "comum" = AC-3/AC-1 (permitida com reator em série – Schneider FAQ FA408331, ABB 1SBC101140C0203);
#   ie_ac1 = corrente térmica AC-1 (A); pico_max = corrente de fechamento máxima admissível (A) p/ manobra de capacitor.
#   "capacitor" = AC-6b com resistores de pré-carga (pico ilimitado na prática).

"Padrão Electric":
  descricao: "Padrão dos projetos Electric (Drive): Epcos/TDK + WEG/Siemens/Holec equivalentes"
  capacitores: null            # usa a série padrão da plataforma (UNID_KVAR)
  contatora_preferida: capacitor

ABB:
  descricao: "Tudo ABB (exceto o reator, Electric)"
  fonte_geral:
    - "ABB 1SBC101140C0203 – Contactors for capacitor switching (tabelas A/AF e UA..RA)"
    - "ABB 9AKK108472A1998 rev. A – CLMD Low-voltage capacitors (SKU Brasil 60525xxxxxxBR, 525 V 60 Hz) – conferido 22/11/2026"
    - "new.abb.com (22/11/2026): AF52/AF65/AF80-30-00-13 ativas; OS160GD03 (1SCA114221R1001) ativa, manopla não inclusa"
  capacitores:
    serie: "CLMD (caixa metálica, dielétrico seco, fabricação Brasil)"
    unidades:          # V nominal: [kvar a 60 Hz] – só os que têm medida de catálogo (CLMD43/53/63; CLMD13 sem desenho)
      525: [20, 25, 30, 35, 40, 45, 50, 55, 60, 65, 70, 75, 80]
      690: [20, 25, 30, 40, 50]
      800: [25, 40, 50]
    codigos:           # 9AKK108472A1998: SKU = 60 + V + kvar×1000 (6 dígitos) + BR
      525: {20: "CLMD43 20 kvar – 60525020000BR", 25: "CLMD43 25 kvar – 60525025000BR", 30: "CLMD43 30 kvar – 60525030000BR",
            35: "CLMD53 35 kvar – 60525035000BR", 40: "CLMD53 40 kvar – 60525040000BR", 45: "CLMD53 45 kvar – 60525045000BR",
            50: "CLMD63 50 kvar – 60525050000BR", 55: "CLMD63 55 kvar – 60525055000BR", 60: "CLMD63 60 kvar – 60525060000BR",
            65: "CLMD63 65 kvar – 60525065000BR", 70: "CLMD63 70 kvar – 60525070000BR", 75: "CLMD63 75 kvar – 60525075000BR",
            80: "CLMD63 80 kvar – 60525080000BR"}
    codigo: "CLMD {kvar} kvar {V} V 60 Hz (690/800 V: conferir no catálogo CLMD)"
    conferir: true
  contatora_preferida: comum
  contatoras:
    comum:             # [tipo, ie_ac1 (A), pico_max (A)] – A/AF, pico < 30·In do capacitor (tabela ABB)
      - ["ABB AF52-30-00-13", 100, 2300]   # new.abb.com 22/11/2026: AC-1 100 A (40 °C); AF50 foi substituída
      - ["ABB AF65-30-00-13", 105, 2500]   # AC-1 105 A (40 °C)
      - ["ABB AF80-30-00-13", 125, 2600]   # AC-1 125 A (40 °C)
      - ["ABB AF96-30-00-13", 130, 4000]   # 1SBL407001R1300 – AC-1 130 A (40 °C), borne flexível 6–50 mm² (folha de dados 25/11/2026)
      - ["ABB AF116-30-00-13", 160, 4000]  # 1SFL427001R1300 – AC-1 160 A (40 °C), borne flexível 2×10–70 mm² (folha de dados 25/11/2026)
      - ["ABB AF146-30-00", 225, 4000]
      - ["ABB AF190-30-11", 275, 5000]
      - ["ABB AF265-30-11", 350, 8000]
    capacitor:         # UA..RA – kvar máx a 400/415 V 55 °C
      - ["ABB UA50-30-00RA", 40]
      - ["ABB UA63-30-00RA", 45]
      - ["ABB UA75-30-00RA", 50]
      - ["ABB UA95-30-00RA", 60]
      - ["ABB UA110-30-00RA", 70]
  seccionadora_fusivel: {codigo: "ABB OS160GD03 (1SCA114221R1001) – seccionadora-fusível 160 A NH000/00 3P + manopla frontal OHB (acessório)", conferir: false}
  fusivel_gG: {codigo: "ABB OFAF{tam}H{A} gG {A} A", conferir: false}
  disjuntor: {codigo: "ABB Tmax XT2/XT4 {A} A (termomagnético)", conferir: true}
  disjuntor_comando: {codigo: "ABB S200 (código pela corrente/curva: fabricantes.dj_comando)", conferir: false}
  controlador: {6: "ABB RVC-6 (2GCA288096A0050)", 8: "ABB RVC-8", 10: "ABB RVC-10", 12: "ABB RVC-12", conferir: true}
  rele_falta_fase: {codigo: "ABB CM-PFS.S 200–500 V CA, 2 c/o – 1SVR730824R9300", conferir: false}   # new.abb.com 22/11/2026 (CM-PFE só até 440 V)
  botoes: {emergencia: "ABB MPMT3-11R (cogumelo c/ trava)", seletor: "ABB M2SS1-10B", sinaleiro: "ABB CL2-523G / CL2-523R", conferir: true}
  termostato: {nf: "ABB/Rittal SK 3110.000 (NF, 0–60 °C)", na: "Rittal SK 3110.000 (NA)", conferir: true}
  ventilador: {codigo: "Schneider ClimaSys NSYCVF850M230PF (ABB não fabrica ventilador de painel)", conferir: false}

