projeto_padrao:
  thd_v_max_pct: 5.0          # THD tensão de saída (prática Schaffner/ABB/WEG para filtro senoidal)
  uk_min_pct: 4.0
  uk_max_pct: 10.0            # queda máxima admissível no indutor na f máx de operação
  thd_baixa_ordem_max_pct: 3.0   # distorção por harmônicas 5,7,11,13.. amplificadas pela ressonância
  tolerancias_lc: [[1, 1], [0.95, 0.95], [1.05, 1.10], [0.95, 1.10], [1.05, 0.95]]   # cantos L, C para robustez
  penalidade_cap_nao_preferido: 0.30   # preferir o capacitor do estoque (capacitor_preferido)
  amortecimento_q_opcoes: [0, 10, 6, 4, 3, 2]   # 0 = sem resistor; Rd = Z0/Q em série com capacitores
  uk_busca_max_pct: 15.0         # busca até 15 % (Danfoss/Siemens usam 12–15 %); queda real limitada por uk_max_pct na f máx
  m_max_sobremodulacao: 1.21     # índice máx. com sobremodulação moderada (SVPWM linear = 1,155)
  tensao_motor_min_pu: 0.90      # tensão mínima disponível no motor (V/f) na faixa de operação
  fr_min_mult_fout: 10.0      # fr >= 10 x f saída máx (evita amplificar harmônicas de baixa ordem)
  fr_max_frac_fs: 0.5         # fr <= fs/2 (estabilidade/controle do inversor)
  ic_fund_max_pct: 20.0       # corrente capacitiva fundamental máx (% In) - carrega o inversor
  vcap_max_pu: 1.10           # IEC 60831 / IEC 61071: 1,10 Un contínuo
  icap_max_fator_iec60831: 1.30   # só p/ capacitor IEC 60831 sem dado de datasheet (ver normas_capacitor)
  ripple_pp_max_pct: 45.0     # ripple pico-a-pico da corrente do indutor (% de In pico)
  isat_margem: 1.25           # Isat >= 1,25 x I pico simulado
  margem_corrente: 1.00       # fator sobre a corrente nominal do pedido
  amb_max_c: 40
  delta_t_painel_k: 15        # elevação interna admissível do painel

