- {id: REQ-SEN-030, data: "2026-11-26", area: SENOIDAL, critico: true, requisito: "vc poderia ver com os nossos principais players, mas os filtros senoidais quando vendidos acredito que são abertos, tem sobre uma base metalica para fixação dos equipamentos ... acredito que depois o cliente instala em painel, correto? no que isso muda? o que os fabricantes falam sobre a instalação, onde instalar, pode ser em painel fechado ou ele deve ficar ao tempo aberto, acha que erramos em projetar ele dentro de uma caixa metalica fechada ... consegue projetar essa base metalica com base nos outros fabricantes? consegue fazer o projeto dela para o montador fazer", fonte: "conversa 26/11 21:08", atende: "fsen/base_montagem.py (layout pelo modelo do indutor ind_cad – oblongos dos pés; base plana SAE 1020 6,35 mm, furação completa; desenho A3 PDF + DXF; ET da base para a montadora; guia de instalação para o cliente com folgas, perdas, ar, temperatura, IPXXB, posição; preço da forma aberta); pipeline gera 04_Montadora/4_Base_Montagem e 02_Cliente/5_Instalacao; proposta com as formas (A) aberta e (B) caixa e preços; RFQ da montadora cota as duas; consolidado", verificacao: "teste A&W v1.35.0", status: ATENDIDO, desde: "1.35.0", nota: "Players: TDK IP00 132–320 A (caixa IP21 acessório), Block SFB IP00 aberto/em pé/40 °C, Danfoss IP00/IP20 piso >75 A/45 °C, MTE open panel dentro do invólucro do cliente ou NEMA 1/3R. Schaffner: manual não acessível (redireciona). A&W: base 900×700 mm, ≈185 kg, (A) R$ 35.700 × (B) R$ 44.200. Pendente decisão do engenheiro: qual forma é o padrão."}
