- {id: REQ-CMP-002, data: "2026-11-22", area: COMPONENTES, critico: true, requisito: "Projeto vai para cotação com fornecedores e montador: PROIBIDO componente fictício. Todo componente real, em fabricação, com código e medidas do catálogo técnico ATUAL do fabricante, desenhado com o tamanho real. Pesquisa começa SEMPRE pelo site do fabricante (ABB, WEG, Siemens, Schneider – eles mantêm atualizado); se não achar, pesquisa profunda e muitas tentativas; só depois disso sinalizar em VERMELHO (projeto não liberado para cotação).", fonte: "conversa 22/11 18:27 + 18:30", atende: "fabricantes.yaml/dimensoes_componentes.yaml com códigos e medidas conferidos nos sites ABB/Schneider em 22/11/2026", verificacao: "auto:componentes_reais", status: PARCIAL, desde: "1.25.2", nota: "falta: trafo de comando (ABB/Schneider não vendem no Brasil – fornecedor nacional), botoeiras/sinaleiros/termostatos/controlador a conferir"}
- {id: REQ-CMP-003, data: "2026-11-22", area: COMPONENTES, critico: true, requisito: "Para CADA componente, tirar do catálogo as especificações de montagem: distâncias mínimas (entre unidades/parede), calor (perdas, temperatura), torque de aperto, tipo de ligação/terminal; e conferir se o cabo de força CALCULADO entra no borne do equipamento (seção máx. do terminal no catálogo).", fonte: "conversa 22/11 18:37", atende: "afastamento de catálogo entre capacitores + cabo calculado × borne (ClampTite ≤16 mm² a confirmar na instrução NVE45179); torques no banco", verificacao: "auto:componentes_reais", status: PARCIAL, desde: "1.25.2", nota: "completar para todos os componentes"}
- {id: REQ-CMP-004, data: "2026-11-22", area: COMPONENTES, critico: true, requisito: "Capacitores: preferir unidades MENORES (25 kvar 525 V), 3 ou 4 por estágio – capacitores grandes em PPM a seco esquentam muito (experiência de campo); é mais caro mas não esquentam tanto. Vale para todas as marcas.", fonte: "conversa 22/11 19:59", atende: "banco.escolher_capacitor: unidade mais próxima de 25 kvar em todas as marcas", verificacao: "manual", status: ATENDIDO, desde: "1.25.3", nota: "Panatlântica: ABB 3 × CLMD43 25 kvar; Schneider 3 × 24 kvar"}
- {id: REQ-CMP-005, data: "2026-11-22", area: COMPONENTES, critico: true, requisito: "Trafo de comando: fornecedor Rasatronic ou Wise (modelo real de catálogo).", fonte: "conversa 22/11 19:59", atende: "lista e esquema: Rasatronic (ou Wise) isolador monofásico IP-00 sob encomenda, VA calculado", verificacao: "manual", status: PARCIAL, desde: "1.25.3", nota: "site Rasatronic não publica medidas – pedir desenho ao fornecedor para o 3D"}
- {id: REQ-BCO-002, data: "2026-11-22", area: BANCO, critico: true, requisito: "O padrão de filtro dessintonizado é FD 8,16 % (Nr 3,5 – 210 Hz), não 7 %. Nem a IA nem o operador devem propor 7 % como premissa; outro FD só se o cliente pedir ou houver 3ª harmônica relevante (14 %).", fonte: "conversa 22/11 21:56 ('O padrão de filtro dessintonziado é 8.16% não 7%')", atende: "banco.Pedido.nr = 3,5 (padrão); leitor_banco.INSTRUCAO: a IA não lista FD como lacuna nem sugere 7 %", verificacao: "manual", status: ATENDIDO, desde: "1.26.1", nota: "erro visto no teste real da Panatlântica pelo Assistente IA: a IA sugeriu FD 7 % e a resposta ao Assistente repetiu; projeto refeito com 8,16 %"}
- {id: REQ-REF-007, data: "2026-11-22", area: REFERENCIAS, critico: false, requisito: "Teste real da Panatlântica: usar 400 kvar para comparar com o projeto original da Panatlântica. Os outros dados seguem o fluxo da plataforma (sem eu forçar decisões além do montante).", fonte: "conversa 22/11 21:57 ('Usa 400 kvar para comparar com o projeto original da panatlantica' / 'Os outros vc segue o fluxo da plataforma')", atende: "teste real pela plataforma local com 400 kvar (8 × 50), FD 8,16 %", verificacao: "manual", status: PENDENTE, desde: "", nota: ""}
- {id: REQ-BCO-003, data: "2026-11-22", area: BANCO, critico: false, requisito: "Estágios/reatores padrão que eu uso: 25 kvar e 50 kvar. Na Panatlântica o projeto original tem somente reatores de 50 kvar, mas aceito opções diferentes desde que nesses padrões (25 e 50 kvar). Complemento 22:14: 25 e 50 são o meu padrão, mas se precisar de outros eu uso 12,5 – 25 – 50 – 75 – 100 kvar. Esse é o padrão para os filtros dessintonizados E sintonizados na baixa tensão. Implementar na plataforma; posso ter outros valores, pois o cliente pode exigir (estágio pedido pelo cliente é sempre aceito).", fonte: "conversa 22/11 22:13, 22:14 e 22:15", atende: "estágios em módulos padrão 25/50 kvar (ex.: Panatlântica 400 kvar = 25 + 25 + 7 × 50)", verificacao: "manual", status: PARCIAL, desde: "1.26.0", nota: "comparação com o original da Panatlântica: pelo reator de 50 kvar; conferir se a plataforma oferece 12,5/75/100 kvar como módulos"}
- {id: REQ-GER-013, data: "2026-11-22", area: GERAL, critico: true, requisito: "O projeto tem que ser bem flexível para os 3 tipos de filtros (senoidal, dessintonizado, sintonizado): os padrões Electric são o ponto de partida, mas o que o cliente exigir (potências de estágio, FD, marca, etc.) tem que ser aceito pela plataforma.", fonte: "conversa 22/11 22:16 ('Sabe que projeto tem que ser bem flexível para os 3 tipos de filtros')", atende: "banco/sintonizado: estágios pedidos pelo cliente aceitos mesmo fora dos módulos padrão (com aviso); Assistente IA aplica o que o operador escrever na resposta", verificacao: "manual", status: PARCIAL, desde: "1.26.1", nota: "revisar o senoidal e os demais parâmetros com o mesmo critério"}
- {id: REQ-REA-011, data: "2026-11-22", area: REATOR, critico: true, requisito: "Indução/perdas do núcleo do reator: considerar só o REGIME permanente (não a energização do estágio).", fonte: "conversa 22/11 22:26 ('Deve ser na energização do estágio, vc tá usando as formas de onda do Atp?' / 'Deve considerar só em regime')", atende: "ind_avancado: formas de onda de regime montadas do espectro harmônico (fundamental + harmônicas medidas) – não usa ATP nem transitório de energização", verificacao: "manual", status: ATENDIDO, desde: "1.13.0", nota: "o 'B pico' do log é o MÁXIMO LOCAL de um elemento (canto) em modelo linear; conferir no relatório a mediana e a indução da coluna (Panatlântica 50 kvar: 2,26 T de pico local)"}
- {id: REQ-REA-012, data: "2026-11-22", area: REATOR, critico: true, requisito: "Indução (T) do reator: é perigoso a plataforma calcular isso sozinha. Tem que saber quantos tesla tinha o indutor real da Cootrans (referência) e comparar a indução calculada com OUTRO software.", fonte: "conversa 22/11 22:28", atende: "ind_verificacao.inducao_coluna: indução média na coluna (lateral e central) no pico de operação – plataforma × NGSolve (linear, mesmo μr) + não-linear + fórmula; entra na tabela da verificação independente (tolerância 3 %)", verificacao: "manual", status: PARCIAL, desde: "1.26.3", nota: "Panatlântica 50 kvar: 1,023 T (plataforma) × 1,030 T (NGSolve) × 1,00 T (fórmula); não-linear 1,04 T; limite de projeto 1,30 T. O 2,26 T do log é pico LOCAL de canto. Falta: ensaios Cootrans (L × I) e dados do núcleo do reator real"}
- {id: REQ-BCO-004, data: "2026-11-22", area: BANCO, critico: true, requisito: "Banco com estágios de potências DIFERENTES (ex.: 25 + 25 + 7 × 50 kvar – padrões que o engenheiro aceita): proteção (fusível, contatora, cabo), lista de material, esquema e 2D/3D têm que ser calculados POR TIPO de estágio, e o capacitor de cada estágio tem que fechar o kvar pedido (±8 %).", fonte: "teste real Panatlântica pela plataforma local 22/11 22:02 (achado da conferência cruzada) + conversa 22:13–22:16", atende: "banco.grupos_estagio/protecao_pior/tags_estagio; lista_material por TIPO de estágio; painel3d com nº de capacitores por estágio (arranjo pelo maior); esquema já era por estágio", verificacao: "auto:conferencia_cruzada", status: PARCIAL, desde: "1.26.3", nota: "teste ABB 25+25+7×50: lista, esquema e 3D batem; 25 kvar ABB = 1 × 35 kvar/525 V (23,8 kvar, −4,8 %). Falta: capacitores de tipos diferentes desenhados com as medidas do maior; Schneider não fecha 25 kvar com latas iguais (reprova na verificação)"}
- {id: REQ-CMP-007, data: "2026-11-22", area: COMPONENTES, critico: true, requisito: "Quando combinar capacitores num estágio, usar sempre unidades IGUAIS (mesmo kvar e mesma tensão) – nunca misturar latas diferentes no mesmo estágio.", fonte: "conversa 22/11 22:32 ('Quando combinar capacitores use sempre os dois iguais') e 22:33 ('Capacitores associados sempre iguais')", atende: "banco.escolher_capacitor: a combinação é sempre n × a MESMA unidade (não existe combinação mista no código)", verificacao: "manual", status: ATENDIDO, desde: "1.20.0", nota: "manter ao corrigir o estágio de 25 kvar (REQ-BCO-004): ex. 2 × 15 ou 3 × 12,5 kvar/525 V, nunca 24 + 12,5"}
- {id: REQ-REF-008, data: "2026-11-22", area: REFERENCIAS, critico: false, requisito: "No meu Drive guilando@gmail.com tem muito material em INGLÊS sobre indutores trifásicos para bancos dessintonizados, filtros e indutores monofásicos de 2 colunas. Ver primeiro o da NEPSI; pesquisar em inglês; fazer uma análise e dizer o que ajuda a plataforma. Complemento 22:41: análise PROFUNDA, não rasa – a NEPSI não fabrica indutor, monta filtros; usar as referências dela mas conferir se os FABRICANTES de reator dizem o mesmo; entrar nos sites dos fabricantes que aparecem no Drive e pesquisar a fundo para projetar melhor o indutor do dessintonizado e do sintonizado.", fonte: "conversa 22/11 22:36 e 22:41", atende: "", verificacao: "manual", status: PENDENTE, desde: "", nota: ""}
- {id: REQ-REA-013, data: "2026-11-22", area: REATOR, critico: true, requisito: "Reator de dessintonizado/sintonizado: (1) entreferro múltiplo por coluna (tipo multigap) é complicado de fazer no Brasil – não exigir; (2) bobina é de ALUMÍNIO, em folha ou em barra – muitos usam folha, já usei folha com a Cootrans várias vezes, pode usar (ver o que fica melhor e mais barato); (3) as demais decisões de projeto ficam com a plataforma, desde que SEGURAS: nunca trabalhar no limite, sempre com boa folga para o indutor não aquecer, nem que fique um pouco maior.", fonte: "conversa 22/11 22:50", atende: "banco.B_PROJ_REATOR_T = 1,30 e K_LIN_FUND = 2,5; ind_projeto: caso de saturação 'Linearidade 2,5 × I fundamental' com aviso se L < 90 %", verificacao: "manual", status: PARCIAL, desde: "1.26.1", nota: "decisão tomada: indução de pico ≤ 1,3 T com soma aritmética das harmônicas e linearidade (L ≥ 90 %) até 2,5 × a fundamental (critério NEPSI, o mais conservador dos lidos); manter 2 entreferros por coluna; alumínio (barra ou folha)"}
- {id: REQ-REA-014, data: "2026-11-22", area: REATOR, critico: true, requisito: "Não projetar um reator novo a cada projeto: ter os reatores PADRÃO modelados, salvos e confirmados (estágios 12,5 – 25 – 50 – 75 – 100 kvar), e em cada projeto só SIMULAR em cima deles para ver se os casos passam. Padronizar os estágios ajuda muito; fazer um reator diferente toda vez é complicado. Complemento 22:56: só muda a TENSÃO, as potências ficam as mesmas; em casos novos vale simular com as medições de campo; padronizar ajuda na montagem e nos preços; casos diferentes também ficam salvos – a biblioteca vai crescendo até sair tudo muito rápido.", fonte: "conversa 22/11 22:53 e 22:56", atende: "fsen/biblioteca_reatores.py (propostas → aprovados no Drive BIBLIOTECA_REATORES); pipeline_banco busca reator APROVADO da família que cobre o caso e não reprojeta; todo reator projetado vira proposta; aprovação na página Biblioteca", verificacao: "manual", status: PARCIAL, desde: "1.26.3", nota: "em teste; falta o engenheiro aprovar os primeiros padrões (50 kvar 415 V) e estender ao senoidal"}
- {id: REQ-REA-015, data: "2026-11-22", area: REATOR, critico: true, requisito: "Comparar o reator projetado com o da Cootrans e com fabricantes internacionais (pesquisa profunda na internet): L, corrente, tamanho, peso e características têm que fechar. Era o que eu fazia à mão ao receber o orçamento da Cootrans (L, A, medidas, peso). É fator de APROVAÇÃO e faz parte do projeto.", fonte: "conversa 22/11 23:00", atende: "fsen/reator_benchmark.py + dados/reatores_referencia.yaml: tabela 'Reator × reatores reais' no RESUMO com Check (massa levada ao porte do projeto por (L·I²)^0,75; faixa −15 %…+40 % do reator real instalado)", verificacao: "manual", status: PARCIAL, desde: "1.26.1", nota: "referências cadastradas: Cootrans Panatlântica 2024 (796 µH/95 A/55 kg) e TDK B44066D5050M441; faltam medidas do Cootrans, perdas, mais fabricantes (Mangoldt, Schneider LVR, Trafox, Hammond) e a mesma tabela para o sintonizado. Panatlântica com o critério novo: 59 kg = +16 % do Cootrans (aprovado)"}
- {id: REQ-REL-009, data: "2026-11-23", area: RELATORIOS, critico: false, requisito: "Especificação do indutor para o fabricante: no FILTRO SENOIDAL deve ser MUITO detalhada. No dessintonizado/sintonizado: separar o que vai PARA O FABRICANTE (especificação de desempenho) do projeto detalhado, que fica INTERNO como conferência – mas a especificação tem que ser um BOM detalhamento, não somente indutância e corrente.", fonte: "conversa 23/11 00:29, 00:31 e 00:34", atende: "senoidal: ET + memorial + projeto de referência + desenhos 2D/3D (sem mudança). Banco/sintonizado (v1.26.2): doc_banco.esp_reator com linearidade, indução, elevação, perdas máximas, envelope, massa esperada, construção e ensaios; projeto detalhado em 01_Engenharia/…/Projeto_interno_conferencia_NAO_ENVIAR", verificacao: "manual", status: ATENDIDO, desde: "1.26.2", nota: "critérios da plataforma a confirmar pelo engenheiro: elevação 80 K (classe F), envelope +5 %, massa −15 %"}
- {id: REQ-REA-016, data: "2026-11-23", area: REATOR, critico: false, requisito: "Reator de filtro sintonizado e de dessintonizado: sempre usei classe F (Cootrans) – é o padrão.", fonte: "conversa 23/11 00:51", atende: "PedidoBanco.classe = F (padrão); ET pede classe F com elevação ≤ 80 K (folga)", verificacao: "manual", status: ATENDIDO, desde: "1.26.2", nota: "a classe só define a temperatura que a isolação suporta, não reduz o aquecimento; a folga vem da elevação pedida (80 K) e não da classe"}
- {id: REQ-REF-009, data: "2026-11-23", area: REFERENCIAS, critico: false, requisito: "No Drive, nas pastas dos clientes de filtros (AGCO, Panatlântica, CVI, PLASBIL, ALCAST e outros) há muitas fotos de câmera térmica dos indutores: usar para ver até onde vai a temperatura na prática e calibrar a análise térmica da plataforma.", fonte: "conversa 23/11 00:54", atende: "", verificacao: "manual", status: PENDENTE, desde: "", nota: "plano: localizar as termografias por cliente, ler temperatura máxima/ponto quente, corrente e ambiente de cada foto, e comparar com o cálculo da plataforma (método de projeto × mapa térmico avançado, que hoje divergem: 92 °C × 138 °C na Panatlântica)"}
- {id: REQ-GER-014, data: "2026-11-23", area: GER, critico: true, requisito: "O status final (RESUMO, folha de dados, verificação) nunca pode sair APROVADO quando uma análise interna mais severa reprova: análise térmica avançada (perdas, elevação, ponto quente × classe pedida pelo cliente), NGSolve fora da tolerância, arco elétrico reprovado, ATP não rodado. Resumo e folha de dados usam o resultado MAIS SEVERO; classe térmica na folha de dados = a que o projeto realmente exige; margem térmica mínima (nunca 1 K).", fonte: "engenheiro 23/11 09:43 – veja a auditoria que o deepseek fez vc concorda? (Auditoria_Lote2_Filtro_AW_e_BCD_v1.26.1_Rev00.pdf: 9 bloqueadores, 10 altos)", atende: "fsen/ind_avancado.py (adotar_pior/final), fsen/pipeline_banco.py (_fechar_termica, _teto_perdas, verificacoes_md), fsen/pipeline.py, fsen/termico.py, fsen/checagem.py (status_geral_md), fsen/banco.py (espectro de projeto k_t)", verificacao: "manual", status: ATENDIDO, desde: "1.26.4", nota: "auditoria salva em gestao/analises/2026-11-23_Auditoria_DeepSeek_Lote2_AW_BCD.pdf; conferido no relatório AW v1.26.3: classe F na folha × 164/179 °C, cabo blindado × não blindado, tabela 0,00 A por capacitor, largura 562 mm ≤ 0 mm"}
- {id: REQ-REA-017, data: "2026-11-23", area: REA, critico: true, requisito: "Projeto e análise avançada do reator usam as MESMAS correntes: espectro do local × k_t, fechando √(I1² + ΣIh²) = corrente de projeto In (a da especificação). O caso toda a folga em harmônicas (limite do capacitor IEC 60831) é calculado como caso extremo informativo. Se o ponto quente do pior método não ficar 10 K abaixo do limite da classe (ou da classe pedida pelo cliente), o reator é refeito com meta de elevação menor.", fonte: "engenheiro 23/11 09:46 – pode implementar as correções (auditoria DeepSeek BCD-01/02, AW-01/02)", atende: "fsen/banco.py requisitos_reator (k_termico, Ih_termico, k_harm_extremo); fsen/ind_projeto.py (meta_elevacao, MARGEM_TERMICA_K, ALVO_ELEV_EXT, temp_max_C); fsen/pipeline_banco.py _fechar_termica; fsen/doc_banco.py (tabela do espectro de projeto)", verificacao: "manual", status: ATENDIDO, desde: "1.26.4", nota: "causa da divergência 291 W × 483 W: o projeto usava o espectro físico (26 A de harmônicas) e a análise avançada punha toda a folga em harmônicas (49 A). A CONFIRMAR com o engenheiro: composição da corrente de projeto (mesma composição × k_t) e margem de 10 K; os dois modelos térmicos ainda diferem ~20 K – calibrar com termografia/ensaio de aquecimento"}
- {id: REQ-SEN-020, data: "2026-11-23", area: SEN, critico: true, requisito: "Filtro senoidal: o ponto quente do indutor é conferido contra a classe térmica PEDIDA pelo cliente (não a classe H do material), com o ar no topo do indutor; tabela de corrente por capacitor sem zeros; tensão real no motor declarada contra o V/f; premissa do cabo coerente com o campo usado no cálculo; aviso de projeto de compromisso sem largura ≤ 0 mm.", fonte: "engenheiro 23/11 09:46 – pode implementar as correções (auditoria DeepSeek AW-01, 02, 05, 07, 08, 09)", atende: "fsen/ind_projeto.py (temp_max_C), fsen/termico.py, fsen/relatorio_final.py, fsen/dimensionamento.py, fsen/leitor_ia.py", verificacao: "manual", status: ATENDIDO, desde: "1.26.4", nota: "não tratados nesta versão: amplificação de baixa ordem 9,29 % (AW-03), fase V −7,7 % no NGSolve (AW-04), rejeição de carga (AW-11)"}
- {id: REQ-BCO-005, data: "2026-11-23", area: BCO, critico: true, requisito: "Banco: verificação com Check de (a) I²t do fusível × suportabilidade do cabo no curto e justificativa quando o fusível é maior que o Iz do cabo, (b) borne da contatora × seção do cabo, (c) arco elétrico reprovado repetido na tabela de verificações; status geral do projeto no início do RESUMO somando todas as tabelas; desenho do núcleo com junta de TOPO quando os entreferros ficam nas culatras (sem step-lap); status dos transitórios dizendo que o regime S1 não entra na dupla checagem com o ATP.", fonte: "engenheiro 23/11 09:46 – pode implementar as correções (auditoria DeepSeek BCD-04, 05, 06, 08, 09, 10)", atende: "fsen/banco.py (conferencias_protecao, borne_contatora_mm2, I2T_NH_GG), fsen/pipeline_banco.py, fsen/checagem.py, fsen/ind_desenhos.py, fsen/transitorios.py, fsen/normas_banco.py", verificacao: "manual", status: ATENDIDO, desde: "1.26.4", nota: "I²t dos fusíveis e seção máxima do borne são valores TÍPICOS de catálogo – A CONFERIR; não tratados: Icw/Ipk do barramento por cálculo (BCD-07), TC/controlador/PTC (BCD-12), recalibração do DHTv com a medição (BCD-13)"}
- {id: REQ-REA-018, data: "2026-11-23", area: REA, critico: false, requisito: "Os indutores projetados, tanto do filtro senoidal como do filtro dessintonizado, podem ser reaproveitados no futuro em projetos novos – têm que ficar salvos de forma que um projeto novo possa partir deles.", fonte: "engenheiro por voz 23/11 ~11:00 – Você sabe que esses indutores, tanto para o filtro senoidal como para o filtro dessintonizado, eu posso talvez usar eles no futuro para projetos novos, né?", atende: "fsen/biblioteca_reatores.py (propor/buscar para banco e sintonizado; propor_senoidal salva o indutor do filtro senoidal)", verificacao: "manual", status: PARCIAL, desde: "1.26.4", nota: "v1.26.4: o indutor do senoidal passa a ser SALVO como proposta; falta o reuso automático dele num projeto novo (hoje só banco/sintonizado reaproveitam) e reuso só com térmica APROVADA pelo pior método (REQ-GER-014)"}
- {id: REQ-CMP-008, data: "2026-11-23", area: CMP, critico: false, requisito: "Todos os componentes dos 3 filtros ficam numa biblioteca para acessar no futuro sem refazer a consulta; o cadastro deve ser feito SOZINHO pela plataforma, como nos reatores (proposta automática a cada projeto), porque a equipe não vai ficar conferindo e cadastrando à mão. Num projeto novo a plataforma já USA a lista salva dos projetos anteriores e faz um double check na internet: se o componente ainda existe, ainda é produzido e ainda é comercializado.", fonte: "engenheiro por voz 23/11 ~11:20 – todos os componentes dos três filtros também ficam numa biblioteca para a gente acessar futuramente sem precisar refazer a consulta? ... Pode fazer esse cadastro sozinho como os reatores, porque a gente não vai ficar conferindo e vendo. (~11:35) você salva tudo lá, e na hora de montar um projeto novo você já usa essa lista que já está lá feita de outros, e faz um double check com a internet, se ele ainda existe, se ainda é produzido, se ainda é comercializado.", atende: "", verificacao: "manual", status: PENDENTE, desde: "", nota: "hoje: catálogo interno (dados/*.yaml) + biblioteca de componentes da equipe com cadastro manual (REQ-GER-012). Falta: cada componente usado num projeto (código, medidas, fonte, status A CONFERIR) ser proposto automaticamente na BIBLIOTECA_COMPONENTES do Drive. Atenção: sem conferência, o item continua A CONFERIR antes da compra."}
- {id: REQ-GER-015, data: "2026-11-23", area: GER, critico: false, requisito: "Projeto antigo tem que ajudar o novo (motor de melhora): num cliente parecido com a Panatlântica (mesma tensão, estágios iguais de 50 kvar, painel parecido, talvez estágios a mais ou a menos) não há necessidade de simular, calcular e fazer tudo do zero – cada projeto novo deve sair mais rápido que o anterior. Manter a similaridade com o que era feito manualmente: havia os projetos em CAD, os cálculos em planilha Excel, o ATP, o EPLAN e o SolidWorks, e de cabeça se aproveitava o projeto anterior quando o cliente novo pedia estágios e tensão iguais (mudavam a rede, o curto, a proteção, as harmônicas). PESQUISAR A FUNDO como as empresas de engenharia (as grandes também) reaproveitam projetos antigos nos novos e ANALISAR se hoje, com a IA e essa velocidade, vale a pena reaproveitar tudo ou só o mínimo (os dados iniciais).", fonte: "engenheiro por voz 23/11 ~11:45 – o que ela vai usar do que foi feito da Panatlântica? Tudo? Porque não tem necessidade de simular, calcular, fazer tudo do zero... como um motor de melhora ... a gente sempre tem que ter uma similaridade do que era feito manualmente: manualmente a gente tinha os projetos em CAD, tinha os desenhos (frase interrompida)", atende: "fsen/biblioteca_reatores.py (só o reator aprovado é reaproveitado; verificação, análise avançada e desenhos ainda são refeitos)", verificacao: "manual", status: PENDENTE, desde: "", nota: "proposta feita por voz (aguarda o sim dele): MÓDULO DE ESTÁGIO PADRÃO – reator com verificação e desenhos + capacitor + fusível + contatora + cabos + conferências + arranjo da coluna do painel, salvo e reaproveitado inteiro; recalcular sempre só o que depende do cliente (harmônicas medidas, ressonância com o trafo, curto, arco elétrico, disjuntor geral, transitórios) e conferir se o módulo cobre as correntes do local. Ligado a REQ-REA-014, REQ-REA-018, REQ-CMP-008."}
- {id: REQ-GER-016, data: "2026-11-23", area: GER, critico: false, requisito: "Criar um NÍVEL DE PONTUAÇÃO (maturidade) para tudo o que fica salvo e é reaproveitado – projetos, reatores, módulos, componentes: por exemplo equipamento só salvo/só em desenho; projeto rodado com estudo, calculado, verificado e certificado; depois montado e testado em campo – cada etapa com uma pontuação maior. Serve para acelerar e melhorar os próximos projetos (usar primeiro o que tem pontuação mais alta) e para saber como cada item foi validado.", fonte: "engenheiro por voz 23/11 ~12:10 – como a gente vai fazer essa validação? Somente quando for implementado em campo ou quando rodar o estudo? Você faz tudo automaticamente? Você me pergunta? Ou tem duas etapas? ... projeto rodado, com estudo, certificado, verificado, tem um nível de pontuação; depois vem a parte montado e testado em campo, tem outro nível de pontuação. Acho que a gente poderia criar um nível de pontuação para acelerar isso e para melhorar. O equipamento só foi salvo, como foi salvo? Só foi feito em desenho?", atende: "fsen/maturidade.py; fsen/pipeline_banco.py e fsen/pipeline.py (iniciar + bloco no RESUMO + pasta 06_Evidencias); fsen/biblioteca_reatores.py (pasta_origem, maior maturidade primeiro); telas_ia.tela_maturidade", verificacao: "manual", status: PARCIAL, desde: "1.27.0", nota: "v1.27.0 (pode aplicar, 23/11 10:37): níveis 0–5 aplicados – 1 e 2 automáticos, 3–5 por evidência em 06_Evidencias; a tela pergunta pelos projetos parados há 14 dias. Falta: nível por componente e por módulo de estágio, achar evidência fora da pasta 06_Evidencias. Antes: só existiam 2 estados na biblioteca de reatores (A_CONFERIR / APROVADO) e termica_status (v1.26.4). Proposta a confirmar com ele: níveis 0 salvo/desenho; 1 calculado (projeto rodado); 2 verificado (2º software + análise avançada sem reprovação); 3 aprovado pelo engenheiro; 4 fabricado/ensaiado (ensaio do fabricante); 5 montado e medido em campo (termografia, medição). Níveis 0–2 automáticos; 3–5 só com registro dele. Ligado a REQ-GER-015, REQ-REA-014, REQ-REA-018, REQ-CMP-008."}
- {id: REQ-SEN-021, data: "2026-11-23", area: SEN, critico: false, requisito: "Filtro senoidal: na cotação com os fabricantes partir SEMPRE de classe H (padrão de mercado). A classe pedida pelo cliente (ex.: F) é a mínima; quando o ponto quente passa da classe do cliente mas fica dentro da H, avisar e pedir o aceite.", fonte: "engenheiro 23/11 13:55 – filtro senoidal, qual é o padrão de mercado classe H ou F, o padrão internacional é classe H para filtro senoidal? / (13:58) eu vou ter que cotar ainda, então na cotação com os fabricantes de filtro senoidal vamos sempre partir de classe H.", atende: "fsen/ind_projeto.py requisitos (temp_max_C = classe H, classe_cliente_C); fsen/pipeline.py (aviso de aceite, e-mail); fsen/documentos.py; fsen/relatorio_final.py", verificacao: "manual", status: ATENDIDO, desde: "1.27.1", nota: "pesquisa 23/11 (4 fabricantes, folhas de dados): Block SFA – H (180 °C); Schaffner FN 5040 HV – EIS 200 (N); MTE SineWave Guardian – classe N 200 °C, elevação média até 135 K; TDK/EPCOS B84143V – classe 155 (F). Não há norma que fixe a classe; 3 de 4 usam H ou acima. Aguarda decisão dele: oferecer H como padrão e tratar o F do cliente como mínimo?"}
- {id: REQ-SEN-022, data: "2026-11-25", area: SEN, critico: true, requisito: "Corrigir no filtro senoidal o que a auditoria independente do projeto A&W FSEN-LC-268A-440V (v1.27.1) apontou e o engenheiro aprovar: ponto quente da análise avançada = máx(T máx do mapa, T média + 15 K); folha de dados/protocolo coerentes com a classe H ofertada; prova de linearidade documentada; L por fase no 3D (fase central −8,7 %, desequilíbrio 6,9 %); ressonância carregada L1–C–motor (~1,22 kHz) com amortecimento real; fs = 4 kHz como requisito de contrato (ACS580 reduz sozinho); garantia de pico coerente com o pior caso; resistor de descarga; cabo cálculo × BOM; renomear a AUDITORIA interna.", fonte: "engenheiro 25/11 19:57 – veja a auditoria do a&w que foi simulado na pasta projetos do filtro senoidal do drive, vc concorda? (AUDITORIA_CALCULOS_CAPACITOR_INDUTOR_FSEN-LC-268A-440V.pdf) / (20:01) preciso que vc gere uma nova versão da plataforma de filtro senoidal para corrigir isso, não quero uma correção pontual para este projeto, mas sim para todos", atende: "fsen/ind_avancado.py (adotar_pior, avisos), fsen/ind_verificacao.py (ajuste_gap_3d, linhas_comparacao), fsen/pipeline.py (ordem verificação→desenhos, e-mail fs, ATP), fsen/ind_fem.py + ind_projeto.py (curva conservadora), fsen/simulacao.py + dimensionamento.py (sensibilidade Q, fs), fsen/documentos.py, doc_indutor_fornecedor.py, custos.py, eplan/senoidal_qet.py, auditoria.py, organizar.py, consolidado.py", verificacao: "manual", status: ATENDIDO, desde: "1.28.0", nota: "auditoria salva em gestao/analises/2026-11-25_Auditoria_AW_FSEN-LC-268A-440V_v1.27.1.pdf. Conferido no código: folha de dados ainda diz F/100 K (documentos.py:611) e o protocolo 100 K (doc_indutor_fornecedor.py:334); o pior método usa o máximo do mapa sem acréscimo de ponto quente (ind_avancado.adotar_pior); a tabela de saturação NÃO é placeholder – é FEM não linear, mas a curva B-H tem μr limitado a 60000 até ~1,5 T, então sai linear (precisa explicar e usar curva conservadora). Ressonância carregada conferida à mão: 1003·√(1+210/416,6) ≈ 1230 Hz."}
- {id: REQ-SEN-023, data: "2026-11-25", area: SEN, critico: false, requisito: "O e-mail de cotação aos fabricantes deve dizer o que eles devem entregar na proposta para a plataforma analisar e comparar com o nosso modelo.", fonte: "engenheiro 25/11 20:13 – Tá. Mas vou cotar com fabricantes. Vc consegue colocar no email para os fabricantes o que eles devem entregar na proposta para vc analisar e comparar com nosso modelo?", atende: "fsen/conferencia.py (DOCUMENTOS_PROPOSTA, texto_email_proposta, formulario_xlsx, ler_formulario_xlsx; campos novos indução, Rdc, preço do protótipo); fsen/documentos.py (Email_Indutor e Email_Capacitores + Formulario_Resposta_*.xlsx); telas_conferencia.py (carrega a planilha preenchida)", verificacao: "manual", status: ATENDIDO, desde: "1.28.0", nota: "a planilha tem os mesmos campos da tela Conferir proposta de fornecedor; a conferência compara com a especificação e com o modelo de referência (comparar_referencia)"}
- {id: REQ-BCO-006, data: "2026-11-25", area: BANCO, critico: true, requisito: "Vc não consegue corrigir esses problemas? (Panatlântica v1.28.0: cabo 70 mm² não entra no borne da contatora AF52) – correção geral: o cabo calculado tem que entrar no borne; a plataforma escolhe sozinha a contatora (mesma marca) cujo borne de catálogo aceita o cabo.", fonte: "conversa 25/11 20:51", atende: "fsen/banco.py (protecao_estagio + BORNE_CATALOGO_MM2), dados/fabricantes.yaml, dados/dimensoes_componentes.yaml", verificacao: "auto:conferencias_protecao", status: ATENDIDO, desde: "1.28.1", nota: "Borne real ABB conferido nas folhas de dados (AF52 35, AF96 50, AF116 70 mm² flexível). Alternativa não automática: 2 × 35 mm² por fase na AF52."}
- {id: REQ-SEG-015, data: "2026-11-25", area: SEGURANCA, critico: true, requisito: "Vc não consegue corrigir esses problemas? (arco 19,8 cal/cm² nos terminais de entrada) – correção geral: o lado de linha do disjuntor geral é energia do alimentador do cliente; o painel isola os terminais (tampa + IPXXB), etiqueta e pede o tempo real da proteção; só reprova acima de 40 cal/cm².", fonte: "conversa 25/11 20:51", atende: "fsen/arco.py (linhas_check, lado_linha, MEDIDAS), fsen/lista_material.py, fsen/leitor_banco.py, fsen/banco.py (t_protecao_montante_ms)", verificacao: "auto:arco", status: ATENDIDO, desde: "1.28.1", nota: "Acima de 40 cal/cm² não há vestimenta – o cliente tem que reduzir o tempo a montante (modo manutenção, relé de arco). Tempo informado pelo cliente passa a ser lido do pedido."}
- {id: REQ-BCO-007, data: "2026-11-25", area: BANCO, critico: true, requisito: "Essa contatora é para qts amps kvar? Estou achando cabo de 70 muito grande, eu usava 50 mm (estágio 50 kvar 415 V, Panatlântica v1.28.1: cabo 70 mm² e AF116).", fonte: "conversa 25/11 21:21-21:22", atende: "fsen/fiacao_iec61439.py + fsen/banco.py", verificacao: "manual", status: ATENDIDO, desde: "1.29.0", nota: "70 mm² vem do agrupamento em feixe na canaleta (FCA 0,65 para 4 circuitos) × ar interno 50 °C sobre In 92 A. Projeto real Panatlântica 2024 (REF-PANAT-2024, esquema REV 2): 35 mm² nos estágios com Epcos B44066-S6012. Proposta: cabos do estágio em camada única afastados (FCA melhor) → 50 mm² + contatora com borne de 50 mm²; aguardando o engenheiro."}
- {id: REQ-PNL-031, data: "2026-11-25", area: PAINEL, critico: true, requisito: "Uma pergunta, cabo de força em painel elétrico fechado leva em conta a 5410? Não seria a IEC? A 5410 não sei para locais fora do painel, ou ela define TB que os mesmo metodos de ampacidade de cabos valem para painéis elétricos fechados?", fonte: "conversa 25/11 21:27", atende: "fsen/fiacao_iec61439.py (Anexo H, 125 %, 70 °C, ar 55 °C), fsen/banco.py, fsen/mecanica.py, fsen/eplan/banco_qet.py, fsen/normas_banco.py, fsen/termico.py, fsen/documentos.py", verificacao: "manual", status: ATENDIDO, desde: "1.29.0", nota: "Resposta: fiação INTERNA do conjunto = NBR IEC 61439-1 (§8.6.3 escolha do fabricante do painel, Anexo H correntes de condutores internos a 55 °C, §10.10 elevação de temperatura); NBR 5410 = instalação (cabos do cliente até o painel). Plataforma hoje usa tabelas da NBR 5410 (FCT/FCA) para a fiação interna – conservador. Proposta: trocar pelo método do Anexo H (arranjo real: canaleta, encostados, espaçados; isolação 90 °C; ar interno do cálculo térmico). Ligado a REQ-BCO-007."}
- {id: REQ-PNL-032, data: "2026-11-25", area: PAINEL, critico: true, requisito: "então vc precisa mudar todo o codigo para a fiação cabos e tudo mais que ela fala a NBR IEC 61439-1 nos 3 filtros, precisa fazer isso pois preciso seguir a norma, não posso dar brecha para uma auditoria externa ver esse erro de 5410. / vc tem certeza absoluta que é a é a NBR IEC 61439-1? ela serve para o caso onde vou usar filtros? faça uma pesquisa mais profunda, o que se fala no brasil e exteior os principais montadores de paines sobre isso?", fonte: "conversa 25/11 21:35-21:37", atende: "fsen/fiacao_iec61439.py (Anexo H, 125 %, 70 °C, ar 55 °C), fsen/banco.py, fsen/mecanica.py, fsen/eplan/banco_qet.py, fsen/normas_banco.py, fsen/termico.py, fsen/documentos.py", verificacao: "manual", status: ATENDIDO, desde: "1.29.0", nota: "Primeiro: pesquisa profunda (normas aplicáveis a banco de capacitores, filtro dessintonizado/sintonizado e filtro senoidal; prática de montadores no Brasil e exterior). Depois: trocar o dimensionamento da fiação interna nos 3 filtros. Pesquisa feita: gestao/analises/2026-11-25_norma_fiacao_interna_IEC61439.md (confirmado: NBR IEC 61439-1/-2 para o painel; IEC 61921 manda atender 61439 nos bancos; NBR 5410 §1.4 deixa os conjuntos com a norma deles). IEC 61439-1 Anexo H usa I30 da IEC 60364-5-52 × k1 (70 °C) × k2; 10.10.4 exige seção por 125 % da corrente e componentes a 80 %."}
- {id: REQ-PNL-033, data: "2026-11-25", area: PAINEL, critico: true, requisito: "A canaleta é comando, os cabos de força são por fora das canaletas. O espaçamento depende da montagem, mas normalmente são espaçados pois consigo medir, na máximo um escostado ao outro. Se vc usou cabos de força por dentro das canaletas tá errado em todos os filtros. Precisa mudar em todo o código isso", fonte: "conversa 25/11 21:50", atende: "fsen/fiacao_iec61439.py, fsen/banco.py, fsen/mecanica.py, fsen/painel3d.py, fsen/lista_material.py, fsen/normas_banco.py, fsen/termico.py", verificacao: "auto:painel_montagem", status: ATENDIDO, desde: "1.29.0", nota: "Força fora da canaleta, espaçados ≥ 1 diâmetro (padrão); opção encostados no pedido (arranjo_cabos_forca); canaleta só comando; 3D com rotas fora da canaleta e sem canaletas horizontais de força no verso; espaçadores na lista."}
- {id: REQ-SEN-024, data: "2026-11-25", area: SENOIDAL, critico: true, requisito: "Esse indutor e capacitores formando um LC estão de acordo com mercado internacional para essa faixa de corrente e tensão? Vc sempre precisa buscar nos 4 players mundiais se o nosso dimensionamento segue o que eles vendem, com fazer este tipo de checagem TB e criar uma pasta tipo concorrentes ou players com as informações que vc usou deles neste nível de tensão e corrente para sua comparação? Vc concorda? Isso há existe no código?", fonte: "conversa 25/11 23:49", atende: "dados/players_filtro_senoidal.yaml, fsen/players.py, fsen/pipeline.py, fsen/organizar.py, fsen/consolidado.py", verificacao: "manual", status: PARCIAL, desde: "1.30.0", nota: "Hoje existe só para o INDUTOR (spec_indutor.REF_MERCADO_PADRAO: Schaffner FN5040 e REO CNW 933 – L, perdas, massa; ponto_otimo: MTE uk 8–10 %, fr/fs 0,20–0,35). Falta: capacitor (C, fr), 4 players com fonte/data, pasta de players no projeto. Pesquisa A&W: gestao/analises/2026-11-25_players_filtro_senoidal_268A_440V.md."}
- {id: REQ-SEN-025, data: "2026-11-25", area: SENOIDAL, critico: false, requisito: "Outra coisa sobre os capacitores, eu vejo que quando a corrente sobe eles usam estrela. Existe alguma documentação regas de engenharia cálculos livros de eletrônica de potência falando quando usar em delta e quando em estrela? Os players que vc listou a partir de qual corrente eles usam em estrela tem alguma relação? Todos seguem o mesmo padrão", fonte: "conversa 25/11 23:59", atende: "-", verificacao: "manual", status: PENDENTE, desde: "-", nota: "Dados dos datasheets: Schaffner FN5040 Y até 75 A e Δ a partir de 115 A (o contrário do que parecia); Block SFB Δ em toda a linha; TDK e Danfoss publicam C equivalente em estrela (não a ligação real); MTE não publica. Pesquisar regra/literatura e registrar."}
- {id: REQ-DOC-020, data: "2026-11-26", area: DOCUMENTOS, critico: false, requisito: "estava vendo aqui e vc poderia melhorar ou gerar um word tb juntamente com o email que vai para o cliente que hoje é .txt. como é um texto longo é melhor fazer um word com ET especificação tecnica de indutor para filtro senoidal, ou capacitores para filtro senoidal fazer para todos os itens, pois como é longo prefiro anexar no email, faz um word de ET bacana bonito facil de ler e bem organizado. para a montadora ela não é um fornecedor, o que eu mando para ela cotar a montagem, isso já ta pronto? normalmente em filtro senoidal eu forneco indutor e capacitor, em filtro dessintonizado só forneco indutor, em filtro sintonizado forneco indutor e capacitor", fonte: "conversa 26/11 09:35", atende: "fsen/et_cotacao.py, fsen/documentos.py (et_fornecedores, finalizar_cotacoes, rfq_montagem), fsen/doc_banco.py (esp_reator, et_capacitor_sintonizado), fsen/pipeline.py, fsen/pipeline_banco.py, fsen/organizar.py, fsen/conferencia_projeto.py", verificacao: "manual", status: ATENDIDO, desde: "1.31.0", nota: "E-mail curto (.txt) + ET Word completa e bonita por item fornecido pela Electric; escopo de fornecimento Electric: senoidal = indutor + capacitor; dessintonizado = só reator; sintonizado = reator + capacitor; montadora recebe pacote de cotação de montagem (não é fornecedor de componente Electric)."}
