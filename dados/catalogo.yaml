# Modelo de custo do indutor trifásico (até receber cotações reais).
# custo = base + k_energia * (soma 3 fases de 1/2 L Ipk^2, em J)
# O histórico (dados/historico.db) recalibra estes coeficientes.
indutor_custo:
  fornecedor: "Cootrans"
  base: 2000.0
  k_energia: 120.0            # R$/J  - confirmar com cotações (calibra pelo histórico)
  kg_por_j: 1.8               # kg por J armazenado (ref. FN5040-260: ~49 J, ~90 kg de reator)
  densidade_kg_m3: 3500       # densidade aparente do reator montado (para estimar dimensões)
  perda_k: 170.0              # perdas = perda_k * E^perda_exp (W; E = 1/2 L (√2 In)^2 por fase) – calibrado FN5040
  perda_exp: 0.85

